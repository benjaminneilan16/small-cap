name: Bygg universe.txt

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 1 * *"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Hämta koden
        uses: actions/checkout@v4
      - name: Sätt upp Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Installera beroenden
        run: pip install -r requirements.txt
      - name: Bygg universe.txt från company_names.txt
        run: python build_universe.py
      - name: Spara resultatet
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add universe.txt unresolved.txt
          if git diff --staged --quiet; then
            echo "Ingen förändring i universe.txt"
          else
            git commit -m "Uppdaterar universe.txt ($(date -u +'%Y-%m-%d'))"
            git push
          fi

name: Morgonkoll — Sverige

# Körs strax efter Stockholmsbörsens öppning (09:00 svensk tid) för att
# fånga upp ev. fyllnader i öppningsauktionen. Lägger INGA nya ordrar.
#
# Skriver om positions.csv/orders.csv (INTE latest.md) om något
# fyllts — annars visar frontend-appen fortfarande "inga positioner"
# tills kvällskörningen, trots att en riktig fyllnad redan skett.
on:
  schedule:
    - cron: "15 7 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Hämta koden
        uses: actions/checkout@v4
      - name: Sätt upp Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Installera beroenden
        run: pip install -r requirements.txt
      - name: Morgonkoll
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python run_morning.py --market se
      - name: Spara resultatet
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add data/market_se.db
          git add reports/positions.csv reports/orders.csv 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "Inget nytt att spara"
          else
            git commit -m "SE morgonkoll $(date -u +'%Y-%m-%d %H:%M')"
            git checkout -- . 2>/dev/null || true
            git pull --rebase -X theirs
            git push
          fi

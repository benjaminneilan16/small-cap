name: Intradagskoll — USA

on:
  schedule:
    - cron: "0 14,17,19 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Hämta koden
        uses: actions/checkout@v4
      - name: Sätt upp Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Installera beroenden
        run: pip install -r requirements.txt
      - name: Intradagskoll
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python run_intraday.py --market us
      - name: Spara resultatet
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add data/market_us.db
          git add reports/positions_us.csv reports/orders_us.csv reports/portfolio_us.json 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "Inga tillbakadragningar att spara"
          else
            git commit -m "US intradagskoll $(date -u +'%Y-%m-%d %H:%M')"
            git checkout -- . 2>/dev/null || true
            git pull --rebase -X theirs
            git push
          fi

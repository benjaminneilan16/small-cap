name: Intradagskoll — Sverige

# Kör några gånger under handelsdagen för att dra tillbaka ordrar som
# fallit kraftigt sedan de lades — se smallcap/intraday.py för
# resonemanget. Tider valda för att ligga inom svensk handelstid
# (09:00–17:30 lokal, ~07:00–15:30 UTC sommartid).
on:
  schedule:
    - cron: "0 9,12,15 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Hämta koden
        uses: actions/checkout@v4
      - name: Sätt upp Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Installera beroenden
        run: pip install -r requirements.txt
      - name: Intradagskoll
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python run_intraday.py --market se
      - name: Spara resultatet
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add data/market_se.db
          if git diff --staged --quiet; then
            echo "Inga tillbakadragningar att spara"
          else
            git commit -m "SE intradagskoll $(date -u +'%Y-%m-%d %H:%M')"
            git push
          fi
